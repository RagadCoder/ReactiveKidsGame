<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مغامرات المستكشف الصغير</title><meta name="theme-color" content="#dcebf3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<script>/* الوضع الليلي: يُطبَّق قبل الرسم لتجنّب الوميض. الافتراضي يتبع إعداد الجهاز */try{var th=localStorage.getItem('theme');if(th=='night'||!th&&matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('night')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-weight:500;background:#edf3ee;color:#374151;overflow:hidden}
/* خلفية هادئة: سماء زرقاء باهتة ← أخضر مريمي ← رمل دافئ، بلا ألوان صارخة ولا حركة */
body{background:transparent;overscroll-behavior:none}button{touch-action:manipulation}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 14% 22%,#f3e0e4 0,transparent 26%),radial-gradient(circle at 86% 30%,#e4e1f2 0,transparent 24%),linear-gradient(180deg,#dcebf3 0%,#e6f0ec 48%,#f1ead9 100%)}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
/* ===== الوضع الليلي: سماء كحلية هادئة + قمر ونجوم، ألوان خافتة غير مُجهِدة ===== */
html:not(.night) #bg .nt{display:none}html.night #sun{display:none}
html.night{background:#18203a;color-scheme:dark}html.night body{color:#e2e8f0}
html.night #bg{background:radial-gradient(circle at 14% 22%,#33304f 0,transparent 26%),radial-gradient(circle at 86% 30%,#2a3557 0,transparent 24%),linear-gradient(180deg,#131a2e 0%,#1d2741 52%,#2a2a3f 100%)}
html.night #bg .cl{fill:#a3b0d0;opacity:.18}html.night #bg .d1{fill:#24324a}html.night #bg .d2{fill:#2d3045}html.night #bg .d3{fill:#353447}
html.night #bb{background:#2a3249;color:#e5e7eb;border-color:#3d4866}
html.night .b{background:#2a3249;color:#e5e7eb;border-color:#3d4866}
html.night .area{background:#222a3e;border-color:#3a4560;box-shadow:inset 0 2px 8px #0005}
html.night .area>*{filter:brightness(.84)}
html.night .mq,html.night .tw,html.night .xoh,html.night .tyh,html.night .mft,html.night .gal,html.night .gh{color:#e2e8f0}
html.night .mft.brk{color:#f3d27e}html.night .gh::after{background:#3a4560}
html.night .card{filter:brightness(.8) saturate(.9);border-color:#3a4560}
html.night .bc{background:#252d44d9;border-color:#3a4560}html.night .bc h1{color:#c7d2fe}html.night .bc h1 span{color:#93c5fd}html.night .bc p{color:#a5b4fc}
html.night .ov{background:rgba(20,26,42,.96);color:#e5e7eb}html.night .lbd div{background:#2a3249}html.night .lbd .me{background:#4a4226}
html.night .sth{background:#3a3524;color:#f1e7c8}html.night .row{background:#2a3249;color:#e5e7eb}html.night .row.has{background:#243a2d}
html.night .tbar{background:#3a4560}html.night .pal button{background:#2a3249}
.thb{font-size:inherit}
.tt span,.pl,.xoh .on,.gi{color:#334155}
/* شريط السماء أعلى الخريطة: شمس في النهار، قمر ونجوم في الليل */
.sky{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 18px;border-radius:2rem;background:linear-gradient(90deg,#e4f0f7,#f7efdc);border:3px solid #fff;font-weight:800;font-size:clamp(17px,3.4vmin,24px);color:#475569;box-shadow:0 4px 12px #0000000d}
.sky svg{width:clamp(46px,8vmin,66px);height:clamp(46px,8vmin,66px);flex:none}
html.night .sky{background:linear-gradient(90deg,#1e2946,#2c2e4a);border-color:#3a4560;color:#e2e8f0}
html:not(.night) .sky .n,html.night .sky .d{display:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hd{display:none;align-items:center;gap:12px;padding:10px 14px}
#av{width:clamp(60px,12vmin,88px);height:clamp(60px,12vmin,88px);border-radius:50%;border:4px solid #facc15;padding:0;background:#fff;box-shadow:0 4px 10px #0002;flex:none}
#av img,.bigav{width:100%;height:100%;border-radius:50%;display:block}
.talk #av{animation:bn .45s infinite alternate;box-shadow:0 0 0 6px #fde68a}
@keyframes bn{to{transform:translateY(-7px) scale(1.06)}}
#bb{background:#fff;border-radius:24px 4px 24px 24px;padding:10px 18px;font-size:clamp(15px,3.2vmin,22px);font-weight:800;box-shadow:0 2px 8px #0001;border:1px solid #dbeafe;max-width:min(52vw,520px);line-height:1.5;
/* ارتفاع ثابت (سطران) حتى لا تتغيّر مساحة اللعب عندما يتكلّم وليد */
min-height:calc(3em + 20px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#nav{margin-right:auto;display:flex;gap:8px;align-items:center}#nx{display:flex}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.b{border:1px solid #f1f5f9;border-radius:2rem;background:#fff;font:inherit;font-weight:800;font-size:clamp(16px,3.4vmin,24px);padding:9px 18px;color:#1f2937;box-shadow:0 2px 6px #0002;position:relative;overflow:hidden}
.b:active{transform:scale(.95)}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:#bfdbfe;opacity:.7;z-index:-1}
.area{flex:1;min-height:0;container-type:size;position:relative;margin:4px 12px 12px;border-radius:2.5rem;background:#fffcf6;overflow:hidden;touch-action:none;border:4px solid #f3e8cf;box-shadow:inset 0 2px 8px #0001}
.boot{flex:1;background:transparent;display:flex;align-items:center;justify-content:center;padding:16px}
.bc{text-align:center;background:#ffffff80;border:1px solid #fff;border-radius:3rem;padding:clamp(20px,5vmin,48px);box-shadow:0 12px 30px #0002}
.bc .bigav{width:clamp(90px,22vmin,140px);height:clamp(90px,22vmin,140px);border:4px solid #facc15;box-shadow:0 6px 14px #0003;margin:0 auto}
.bc h1{margin:14px 0 4px;font-size:clamp(30px,8vmin,54px);color:#1e3a8a;line-height:1.2}.bc h1 span{color:#2563eb}
.bc p{margin:0 0 18px;font-size:clamp(16px,3.4vmin,22px);color:#1e40af}
.start{background:#3b82f6;color:#fff;font:inherit;font-weight:800;font-size:clamp(22px,5vmin,30px);padding:14px 44px;border:0;border-radius:999px;box-shadow:0 8px 0 #2563eb}.start:active{transform:translateY(6px);box-shadow:0 2px 0 #2563eb}
.home{padding:10px 18px 18px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:clamp(12px,3vmin,28px);max-width:960px;margin:auto}
.card{border:4px solid #fff;border-radius:2.5rem;padding:clamp(14px,3.5vmin,30px) 8px;font:inherit;font-weight:800;font-size:clamp(17px,3.4vmin,23px);color:#1f2937;box-shadow:0 8px 18px #0001;transition:transform .2s}
.card:active{transform:translateY(-4px)}
.gh{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 4px -6px;font-size:clamp(17px,3.4vmin,23px);font-weight:800;color:#475569}
.gh::after{content:'';flex:1;height:2px;border-radius:2px;background:#e3d9c4}
.gh:first-child{margin-top:0}
.card span{display:block;font-size:clamp(46px,11vmin,76px);margin-bottom:6px}
.card small{display:block;font-size:.7em;font-weight:500;color:#6b7280}
.sh{position:absolute;transform:translate(-50%,-50%);font-size:clamp(46px,11vmin,84px);line-height:1;touch-action:none;text-shadow:0 3px 0 rgba(0,0,0,.08)}
.pop{animation:pp .5s}@keyframes pp{0%{transform:translate(-50%,-50%) scale(.2)}60%{transform:translate(-50%,-50%) scale(1.3)}}
.bub{position:absolute;bottom:-90px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#bfe3f5);opacity:.85;animation:rise 9s linear forwards}
@keyframes rise{to{transform:translateY(-120vh)}}
.ov{position:fixed;inset:0;background:rgba(246,243,234,.96);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:clamp(22px,5vmin,36px);font-weight:800}
.ov .big{font-size:clamp(90px,24vmin,180px);animation:pp .8s}
.cf{position:fixed;top:-40px;font-size:34px;z-index:10;animation:fl 2.2s ease-in forwards;pointer-events:none}
@keyframes fl{to{transform:translateY(115vh) rotate(540deg)}}
.slot{pointer-events:none;position:absolute;transform:translate(-50%,-50%);opacity:.28;filter:grayscale(1)}
.part{position:absolute;transform:translate(-50%,-50%);touch-action:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.1))}
.part.up{z-index:4;scale:1.1}
.basket{position:absolute;bottom:3%;width:26%;height:26%;border-radius:22px;border:4px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vmin,70px)}
.opt{font-size:clamp(70px,18vmin,130px);border:0;background:#dcfce7;border-radius:30px;padding:12px 26px;box-shadow:0 6px 0 #bbf7d0}
.pal{display:flex;gap:6px;overflow:auto;padding:0 14px 6px;align-items:center}
.pal button{font-size:clamp(30px,7vmin,48px);border:0;background:#fff;border-radius:16px;padding:4px 10px;box-shadow:0 2px 6px #0002}
.mini{position:relative;width:170px;height:115px;background:#fff;border-radius:14px;overflow:hidden}
.mini .sh{font-size:24px}
.gal{display:flex;flex-wrap:wrap;gap:14px;padding:14px;justify-content:center;overflow:auto;height:100%;align-content:flex-start}
.gi{background:#f8fafc;border-radius:20px;padding:10px;text-align:center;font-size:18px;min-width:130px;font-weight:800}.gi s{display:block;text-decoration:none;font-size:56px}
@keyframes wig{0%,100%{rotate:0deg}25%{rotate:-6deg}75%{rotate:6deg}}
@keyframes hop{50%{translate:0 -12px}}
.sh,.part,.card,.b,.opt,.gi,.pal button,.bub,#av,#bb{transition:scale .15s,rotate .15s}
.card{transition:transform .2s,scale .15s}
.card:active span{animation:hop .4s}
.boot{position:relative}
/* اختيار المستوى */
.lvs{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:clamp(12px,3vmin,26px);padding:16px}
.lvb{font:inherit;font-weight:800;font-size:clamp(20px,4.5vmin,30px);color:#334155;border:4px solid #fff;border-radius:2rem;background:#e8f1f6;padding:clamp(14px,3vmin,24px) clamp(20px,4vmin,36px);box-shadow:0 6px 0 #d6e4ec;min-width:clamp(130px,22vmin,190px);cursor:pointer}
.lvb:nth-child(2){background:#eef5e9;box-shadow:0 6px 0 #dbe8d2}.lvb:nth-child(3){background:#f8eef0;box-shadow:0 6px 0 #ecdade}.lvb:nth-child(4){background:#f1ecf7;box-shadow:0 6px 0 #e1d8ec}.lvb.two{background:#fbf3e2;box-shadow:0 6px 0 #efe2c6}
.lvb span{display:block;font-size:.75em;margin-bottom:4px}.lvb small{display:block;font-size:.65em;color:#64748b}.lvb:active{transform:translateY(4px)}
/* إكس أو */
.xoh{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vmin,26px);padding:10px;font-size:clamp(17px,3.4vmin,24px);font-weight:800}
.xoh span{padding:2px 12px;border-radius:999px}.xoh .on{background:#fef6dc;box-shadow:0 0 0 3px #f3e1a8}
.xoh svg{width:1.3em;height:1.3em;vertical-align:middle}
.xob{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;margin:0 auto}.xob.wait{pointer-events:none}
.xc{border:0;border-radius:22px;background:#f4efe4;box-shadow:inset 0 -4px 0 #e6dcc6;padding:12%;cursor:pointer}.xc svg{width:100%;height:100%;display:block}
.xc.w{background:#fbefc6}.pop2 svg{animation:pp2 .35s}@keyframes pp2{from{transform:scale(.3)}}
/* لعبة الذاكرة */
.mg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;gap:clamp(6px,1.6vmin,14px)}
.mc{aspect-ratio:1;border:0;padding:0;background:none;perspective:600px;cursor:pointer;font-family:inherit}
.mc i{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}.mc.on i{transform:rotateY(180deg)}
.mc b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:18%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 #0000000f}
.mc b:first-child{background:#dbe8f1;color:#a9c0d0;font-weight:800}
/* أصوات الحيوانات */
.lnk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.lnk line{stroke:#bcd3e3;stroke-width:6;stroke-linecap:round;stroke-dasharray:2 12}.lnk line.ok{stroke:#a9d3a2;stroke-dasharray:none}
.acol{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:clamp(8px,2vmin,16px);z-index:2;right:12%}.acol.w{right:auto;left:12%}
.ab,.wb{border:3px solid #fff;border-radius:22px;background:#f4efe4;box-shadow:0 4px 0 #e6dcc6;cursor:pointer;font-family:inherit;font-weight:800;padding:.12em .45em;touch-action:none;line-height:1.25}
.wb{background:#eef4f8;box-shadow:0 4px 0 #d8e4ec;color:#334155;min-width:4.4em}
.ab.sel{box-shadow:0 0 0 4px #f3d27e}.ab.done,.wb.done{background:#eef7e8;box-shadow:0 4px 0 #cfe5c2;pointer-events:none}
.wb.no,.tt .no{animation:shk .4s}@keyframes shk{25%{translate:-6px}75%{translate:6px}}
/* الكتابة السريعة */
.ty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 8px 12px;gap:8px}
.tyh{display:flex;gap:14px;align-items:center;font-weight:800;font-size:clamp(15px,3vmin,21px);width:min(720px,94%)}
.tbar{flex:1;height:14px;border-radius:9px;background:#efe7d6;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:#a9cfe0;transition:width .25s linear}
.tw{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:clamp(48px,13vmin,112px);color:#334155;line-height:1.35}
.tt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tt span{min-width:1.7em;padding:4px 8px;border-radius:12px;background:#f4efe4;font-size:clamp(20px,4.4vmin,32px);font-weight:800;text-align:center}
.tt .d{background:#e3f1dc;color:#6a9a5b}.tt .c{box-shadow:0 0 0 3px #f3d27e}
.kb{direction:ltr;display:flex;flex-direction:column;gap:6px;width:min(880px,98%)}.kb div{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:64px;height:clamp(38px,8vmin,60px);border:0;border-radius:12px;background:#fff;box-shadow:0 3px 0 #e2e8f0;font:inherit;font-weight:800;font-size:clamp(16px,3.6vmin,26px);color:#334155;cursor:pointer;padding:0}
.kb button.nx{background:#fdf3d4;box-shadow:0 3px 0 #f0dca0}.kb button.hit{background:#e3f1dc}
/* الحساب السريع */
.avr,.lvr{display:flex;gap:clamp(8px,2vmin,16px);flex-wrap:wrap;justify-content:center}
.avb{font-size:clamp(30px,6.5vmin,50px);border:3px solid #fff;border-radius:50%;width:1.75em;height:1.75em;background:#fff;box-shadow:0 3px 8px #0001;cursor:pointer;padding:0}.avb.on{box-shadow:0 0 0 4px #f3d27e;background:#fef6dc}
.mq{font-size:clamp(46px,12vmin,96px);font-weight:800;color:#334155}
.mch{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,2.5vmin,20px);width:min(520px,92%)}
.ma{font:inherit;font-weight:800;font-size:clamp(32px,7.5vmin,58px);border:4px solid #fff;border-radius:26px;background:#e8f1f6;box-shadow:0 6px 0 #d6e4ec;color:#334155;padding:4px 0;cursor:pointer}
.ma:nth-child(2){background:#eef5e9;box-shadow:0 6px 0 #dbe8d2}.ma:nth-child(3){background:#f8eef0;box-shadow:0 6px 0 #ecdade}.ma:nth-child(4){background:#f1ecf7;box-shadow:0 6px 0 #e1d8ec}
.ma.no{opacity:.35;animation:shk .4s}
.mft{font-weight:800;font-size:clamp(15px,3vmin,21px);color:#64748b}.mft.brk{color:#a0731c}
.lbd{display:flex;flex-direction:column;gap:6px;font-size:clamp(18px,3.4vmin,24px);min-width:240px}
.lbd div{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-radius:14px;padding:4px 16px}.lbd .me{background:#fef6dc;box-shadow:0 0 0 3px #f3d27e}
/* التلوين */
.colw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px}
.colw>svg{flex:1;min-height:0;width:100%;max-width:820px;touch-action:none}
.rg{cursor:pointer;transition:fill .25s}
.swr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:4px}
.sw{width:clamp(34px,7vmin,50px);height:clamp(34px,7vmin,50px);border-radius:50%;border:3px solid #e8edf2;box-shadow:0 2px 6px #0002;cursor:pointer;padding:0}.sw.on{outline:4px solid #f3d27e;outline-offset:2px}
/* السلّم والثعبان */
.snw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vmin,32px);padding:10px;flex-wrap:wrap}
.snb{direction:ltr;position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px #0001;border:4px solid #fff}
.snb>div{padding:3px 6px;font-size:clamp(11px,2vmin,16px);font-weight:800;color:#a3aebb}
.snb svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);transition:left .22s,top .22s;z-index:3;filter:drop-shadow(0 3px 0 #0002);line-height:1}
.snp{display:flex;flex-direction:column;gap:12px;align-items:center}
.pl{display:flex;align-items:center;gap:8px;padding:6px 18px;border-radius:999px;background:#fff;font-weight:800;font-size:clamp(16px,3.2vmin,22px);border:3px solid transparent}.pl.on{border-color:#f3d27e;background:#fef6dc}
.dice{width:clamp(80px,15vmin,116px);height:clamp(80px,15vmin,116px);border-radius:24px;border:4px solid #fff;background:#eef4f8;box-shadow:0 6px 0 #d8e4ec;font:inherit;font-size:clamp(42px,9vmin,68px);font-weight:800;color:#334155;cursor:pointer}.dice:disabled{opacity:.6}
/* أحجام تتبع مساحة اللعب (cq) فتبقى مناسبة عند تدوير الجهاز */
.xob{width:min(90cqw,calc(100cqh - 80px));height:min(90cqw,calc(100cqh - 80px))}
.mg{width:min(92cqw,calc(88cqh * var(--c) / var(--r)));font-size:calc(min(92cqw / var(--c),88cqh / var(--r)) * .42)}.mc{font-size:inherit}
.snw{flex-wrap:nowrap}.snb{--bs:min(92cqh,calc(100cqw - 220px));flex:none;width:var(--bs);height:var(--bs)}.tok{font-size:calc(var(--bs) / 12)}
@container (orientation:portrait){.snw{flex-direction:column;gap:10px}.snb{--bs:min(94cqw,calc(100cqh - 120px))}.snp{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}.dice{width:64px;height:64px;font-size:36px}.pl{padding:3px 10px;font-size:15px}}
/* مسرح الطائرة بنسبة ثابتة يتّسع لأي شاشة */
.stg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96cqw,186cqh);aspect-ratio:1.9}
/* متصفحات قديمة (iOS 15 وما قبله) لا تدعم وحدات cq: أحجام بديلة حسب الشاشة */
@supports not (container-type:size){
 .xob{width:min(80vw,calc(100vh - 300px));height:min(80vw,calc(100vh - 300px))}
 .mg{width:min(88vw,calc(62vh * var(--c) / var(--r)));font-size:calc(min(88vw / var(--c),62vh / var(--r)) * .42)}
 .snb{--bs:min(66vh,calc(100vw - 280px))}.stg{width:min(92vw,140vh);height:calc(min(92vw,140vh) / 1.9)}
 @media (orientation:portrait){.snw{flex-direction:column}.snb{--bs:min(90vw,calc(100vh - 340px))}.snp{flex-direction:row;flex-wrap:wrap;justify-content:center}}}
.lvs{overflow-y:auto;touch-action:pan-y}
/* جوال صغير جداً (٣٢٠ بكسل) */
@container (max-width:380px){.lvs{gap:8px;padding:8px}.lvb{min-width:0;padding:6px 14px;font-size:17px;border-width:3px;box-shadow:0 4px 0 #d6e4ec}.lvb span{margin-bottom:0}.avb{font-size:22px}.avr,.lvr{gap:6px}}
/* شاشات قصيرة (جوال بالعرض) */
@container (max-height:340px){.ty{padding:4px 6px 6px;gap:3px}.tw{font-size:34px;line-height:1.15}.tt span{font-size:15px;padding:1px 6px}.kb{gap:3px}.kb div{gap:3px}.kb button{height:26px;font-size:14px;border-radius:8px}.tyh{font-size:14px}
 .mq{font-size:34px}.mch{grid-template-columns:repeat(4,1fr);width:min(640px,96%);gap:8px}.ma{font-size:24px;padding:0;border-radius:18px}.mft{font-size:13px}
 .lvs{gap:8px;padding:8px}.lvb{padding:8px 16px;font-size:18px;min-width:100px}.avb{font-size:24px}.pl{padding:3px 12px;font-size:15px}.dice{width:64px;height:64px;font-size:34px}.opt{font-size:60px;padding:6px 18px}
 .acol{gap:4px;right:16%}.acol.w{left:16%}.ab,.wb{padding:.02em .4em;border-width:2px}}
/* جوال بالطول: صف للأزرار وصف لفقاعة وليد، والأزرار بالأيقونة فقط */
@media (max-width:640px){#hd{flex-wrap:wrap;gap:6px 8px;padding:8px 10px 2px}#av{width:50px;height:50px;border-width:3px}
 #bb{order:3;flex:1 1 100%;max-width:none;font-size:14px;padding:6px 12px;border-radius:16px;min-height:calc(3em + 12px)}
 .row{flex-wrap:wrap}.row .t{flex:1 1 calc(100% - 3em)}
 .tx{display:none}#nav{gap:6px}#nav .b{padding:8px 12px;font-size:18px}.area{margin:4px 8px 8px;border-radius:1.6rem}.home{padding:6px 10px 14px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media (max-height:500px){.bc{padding:12px 28px}.bc .bigav{width:64px;height:64px}.bc h1{font-size:26px;margin:6px 0 2px}.bc h1 br{display:none}.bc h1 span::before{content:' '}.bc p{margin:0 0 10px;font-size:15px}.start{font-size:20px;padding:10px 32px}
 #av{width:46px;height:46px;border-width:3px}#hd{padding:4px 12px}#bb{font-size:14px;padding:5px 12px;min-height:calc(3em + 10px)}.area{margin:2px 10px 8px}.tx{display:none}#nav .b{padding:6px 12px;font-size:17px}}
.mc b:last-child{background:#fffaf0;transform:rotateY(180deg);border:3px solid #f1e6cc}.mc.ok b:last-child{background:#eef7e8;border-color:#cfe5c2}
.studio{padding:14px;max-width:920px;margin:auto}
.sth{background:#fef3c7;border-radius:22px;padding:12px 18px;margin-bottom:12px;font-size:clamp(14px,2.8vmin,18px);line-height:1.7}
.sth b{font-size:1.2em}.sth p{margin:6px 0}.sth label{display:block;font-weight:800}
.sta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-weight:800}
.row{display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:18px;padding:8px 12px;margin-bottom:8px;font-size:clamp(15px,3vmin,20px);font-weight:800;border:2px solid transparent}
.row.has{background:#f0fdf4;border-color:#bbf7d0}
.row .n{color:#94a3b8;min-width:1.8em}.row .t{flex:1;line-height:1.7}
.row button{font-size:clamp(18px,4vmin,24px);border:0;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 2px 6px #0002;cursor:pointer}
.row button:disabled{opacity:.3}
.row button.recing{background:#fecaca;animation:bn .5s infinite alternate}
@media(hover:hover){
.card:hover,.b:hover,.start:hover,.opt:hover,.gi:hover,.pal button:hover,#av:hover,#bb:hover{scale:1.08;animation:wig .5s ease-in-out infinite;cursor:pointer}

.sh:hover,.part:hover{scale:1.2;rotate:8deg;cursor:grab}
.bub:hover{scale:1.25}
.cf{pointer-events:none}}

const after=()=>{const pl=P[cur];if(pl.p>=SM)return winOv();const j=LAD[pl.p]||SNK[pl.p];if(!j)return later(next,450);
 later(()=>{pl.p=j;toks[cur].style.transition='left .8s,top .8s';place(cur);later(()=>toks[cur].style.transition='',850)},350);

/* استوديو صوت وليد — للوالدين: يسجّل الطفل الجمل بصوته فتُستخدم في اللعبة */
function studio(){const a=hdr('استوديو الصوت');a.style.overflow='auto';a.style.touchAction='auto';const w=$('','studio',a);
w.innerHTML=`<div class="sth"><b>🎙️ استوديو صوت وليد — للوالدين</b><p>اجعل طفلك هو صوت وليد! اقرأ له الجملة ثم دعه يردّدها بحماس. اضغط 🔴 للتسجيل ثم ⏹️ للإيقاف، وسيُعاد التسجيل لتسمعه. التسجيلات تُحفظ على هذا الجهاز فقط وتُستخدم فوراً في اللعبة.</p><label><input type="checkbox" id="yg"${YOUNG?' checked':''}> اجعل الصوت أصغر سنّاً (عند تسجيل صوت شخص بالغ)</label><div class="sta"><span id="cnt"></span><button class="b" id="dla">⬇️ تنزيل الكل</button></div></div>`;
const yg=w.querySelector('#yg'),cnt=w.querySelector('#cnt');yg.onchange=()=>{YOUNG=yg.checked;try{localStorage.setItem(YK,YOUNG?'1':'0')}catch(e){}};
const upd=()=>{cnt.textContent=`سُجّلت ${Object.keys(REC).length} من ${LINES.length} جملة`};upd();
let stream=null,mr=null,tmo;const stop=()=>{clearTimeout(tmo);if(mr&&mr.state!='inactive')mr.stop()};
X.push(()=>{stop();if(stream)stream.getTracks().forEach(t=>t.stop())});
const ext=b=>/ogg/.test(b.type)?'ogg':/mp4|aac/.test(b.type)?'m4a':'webm';
const save=(i,b)=>{const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=(i+1)+'.'+ext(b);document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)};
LINES.forEach((t,i)=>{const r=$('','row',w);r.innerHTML=`<span class="n">${i+1}</span><span class="t">${TASH[i]}</span>`;
const btn=(e,f,ti)=>{const b=document.createElement('button');b.textContent=e;b.title=ti;b.onclick=f;r.appendChild(b);return b};
const rec=btn('🔴',async()=>{if(mr&&mr.state=='recording'){const same=rec.classList.contains('recing');stop();if(same)return}
if(!window.MediaRecorder||!navigator.mediaDevices){alert('المتصفح لا يدعم التسجيل. جرّب Chrome أو Edge أو Safari حديث.');return}
hush();try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){alert('تعذّر الوصول إلى الميكروفون. اسمح للمتصفح باستخدامه، وشغّل اللعبة من https أو localhost.');return}
if(!a.isConnected){stream.getTracks().forEach(t=>t.stop());return}
const ch=[],m=new MediaRecorder(stream);mr=m;m.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
m.onstop=()=>{rec.classList.remove('recing');rec.textContent='🔴';if(!ch.length||!a.isConnected)return;const b=new Blob(ch,{type:m.mimeType||'audio/webm'});DB.put(i,b).catch(()=>alert('تعذّر حفظ التسجيل على هذا الجهاز.'));recUrl(i,b);mark();upd();say(t)};
m.start();rec.classList.add('recing');rec.textContent='⏹️';tmo=setTimeout(stop,10000)},'تسجيل');
const pl=btn('▶️',()=>say(t),'استماع'),dl=btn('⬇️',()=>DB.get(i).then(b=>b&&save(i,b)),'تنزيل'),del=btn('🗑️',()=>{if(!confirm('حذف هذا التسجيل؟'))return;DB.del(i).catch(()=>{});recUrl(i);mark();upd()},'حذف');
const mark=()=>{r.classList.toggle('has',!!REC[i]);dl.disabled=del.disabled=!REC[i]};mark()});
w.querySelector('#dla').onclick=()=>{let k=0;Object.keys(REC).forEach(i=>DB.get(+i).then(b=>{if(b)setTimeout(()=>save(+i,b),k++*400)}))}}
start();
